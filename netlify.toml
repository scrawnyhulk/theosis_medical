[build]
  # Publish the already-built static export. Running `npm run build` on Netlify
  # uses the Vercel/Nitro adapter and writes an empty index.html, which blanks
  # the live site.
  command = "true"
  publish = ".vercel/output/static"

[build.environment]
  NODE_VERSION = "22"

# Removed from theosismedical.com (Health Hacks, simulator and old tools).
# These return a real 404. Never redirect them to theosishealth.com:
# the two sites are kept separate.
[[redirects]]
  from = "/hacks"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/hacks/"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/hacks/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/simulator"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/simulator/"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/simulator/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/personal-fat-threshold"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/personal-fat-threshold/"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/personal-fat-threshold.html"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/personal-fat-threshold/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/fat-burn-calculator"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/fat-burn-calculator/"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/fat-burn-calculator/*"
  to = "/404.html"
  status = 404
  force = true

# Missing hashed files must 404 — never fall through to index.html as text/html
# or the browser refuses to run the page and the header stops working.
[[redirects]]
  from = "/assets/*"
  to = "/404.html"
  status = 404

# Every published page is prerendered as a static file, so anything else is a
# real 404 (no more SPA fallback answering 200 for unknown or old URLs).
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
