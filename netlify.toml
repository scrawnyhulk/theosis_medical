[build]
  # Publish the already-built static export. Running `npm run build` on Netlify
  # uses the Vercel/Nitro adapter and writes an empty index.html, which blanks
  # the live site.
  command = "true"
  publish = ".vercel/output/static"

[build.environment]
  NODE_VERSION = "22"

# Host-level door for the private clinician workspace. The plugin inserts a
# status-200 proxy for /clinicianportal, /clinicianportal/, and
# /clinicianportal/* immediately before the /* catch-all, and only when the
# Netlify build variable CLINICIAN_PORTAL_ORIGIN is set to the private https
# origin (no path, no credentials). That host stays in the Netlify UI, not in
# this public repo. Until the variable is set, those paths hit the catch-all
# and 404. This does not password-protect the rest of the site.
[[plugins]]
  package = "/netlify/plugins/clinician-portal"

# Removed from theosismedical.com (Health Hacks, simulator and old tools).
# These return a real 404. Never redirect them to theosishealth.com:
# the two sites are kept separate.
[[redirects]]
  from = "/hacks"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/hacks/"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/hacks/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/simulator"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/simulator/"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/simulator/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/personal-fat-threshold"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/personal-fat-threshold/"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/personal-fat-threshold.html"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/personal-fat-threshold/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/fat-burn-calculator"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/fat-burn-calculator/"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/fat-burn-calculator/*"
  to = "/404.html"
  status = 404
  force = true

# Missing hashed files must 404 — never fall through to index.html as text/html
# or the browser refuses to run the page and the header stops working.
[[redirects]]
  from = "/assets/*"
  to = "/404.html"
  status = 404

# Every published page is prerendered as a static file, so anything else is a
# real 404 (no more SPA fallback answering 200 for unknown or old URLs).
# Keep this catch-all last. netlify/plugins/clinician-portal splices the
# /clinicianportal proxy in front of the first /* rule during the Netlify build.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
