[build]
  # Publish the already-built static export. Running `npm run build` on Netlify
  # uses the Vercel/Nitro adapter and writes an empty index.html, which blanks
  # the live site.
  command = "true"
  publish = ".vercel/output/static"

[build.environment]
  NODE_VERSION = "22"

# Host-level door for the private clinician workspace. The plugin inserts a
# status-200 proxy for /clinicianportal, /clinicianportal/, and
# /clinicianportal/* immediately before the /* catch-all, and only when the
# Netlify build variable CLINICIAN_PORTAL_ORIGIN is set to the private https
# origin (no path, no credentials). That host stays in the Netlify UI, not in
# this public repo. Until the variable is set, those paths hit the catch-all
# and 404. This does not password-protect the rest of the site.
[[plugins]]
  package = "/netlify/plugins/clinician-portal"

# Removed from theosismedical.com (Health Hacks, simulator and old tools).
# These return a real 404. Never redirect them to theosishealth.com:
# the two sites are kept separate.
[[redirects]]
  from = "/hacks"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/hacks/"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/hacks/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/simulator"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/simulator/"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/simulator/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/personal-fat-threshold"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/personal-fat-threshold/"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/personal-fat-threshold.html"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/personal-fat-threshold/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/fat-burn-calculator"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/fat-burn-calculator/"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/fat-burn-calculator/*"
  to = "/404.html"
  status = 404
  force = true

# Missing hashed files must 404 — never fall through to index.html as text/html
# or the browser refuses to run the page and the header stops working.
[[redirects]]
  from = "/assets/*"
  to = "/404.html"
  status = 404

# Theosis Analyzer door. The private app lives at the root of
# https://theosis-emergency-diagnostics.netlify.app — its edge gate (path /*)
# answers / with Location: login.html and Cache-Control: no-store. A status-200
# rewrite from this site does not run that gate, and the CDN stored the app
# HTML (cache-status: stored) even on a miss. There is therefore no status-200
# proxy for /theosisanalyzER. netlify/edge-functions/theosis-analyzer-door.js
# fetches the private host directly, passes Cookie and relative Location
# through, and marks the response no-store.
#
# Netlify treats a path and the same path with a trailing slash as one redirect
# rule, so a 301 in this file cannot add the slash. The edge function 301s the
# bare path (any casing) to /theosisanalyzER/ before the fetch. It also sends
# /ed onto that path. Relative login.html then stays under the prefix.
# /theosisanalyzER/api/* is that same fetch of /api/* on the private host.
# There is no site-wide /api/* rule.
#
# /clinicianportal and /clinicianportal/ 302 to /clinicianportal/login.
# Proxying the bare path comes back with Location: /clinicianportal/ and loops.
# /clinicianportal/* still proxies. These doors are not a site-wide password.
[[redirects]]
  from = "/ed"
  to = "/theosisanalyzER/"
  status = 301
  force = true

[[redirects]]
  from = "/ed/"
  to = "/theosisanalyzER/"
  status = 301
  force = true

[[redirects]]
  from = "/ed/*"
  to = "/theosisanalyzER/:splat"
  status = 301
  force = true

# Do not cache either door. A stored 200 of gated HTML skips the sign-in page.
[[headers]]
  for = "/theosisanalyzER"
  [headers.values]
    Cache-Control = "no-store"
    Netlify-CDN-Cache-Control = "no-store"

[[headers]]
  for = "/theosisanalyzER/*"
  [headers.values]
    Cache-Control = "no-store"
    Netlify-CDN-Cache-Control = "no-store"

[[headers]]
  for = "/clinicianportal"
  [headers.values]
    Cache-Control = "no-store"
    Netlify-CDN-Cache-Control = "no-store"

[[headers]]
  for = "/clinicianportal/"
  [headers.values]
    Cache-Control = "no-store"
    Netlify-CDN-Cache-Control = "no-store"

[[headers]]
  for = "/clinicianportal/*"
  [headers.values]
    Cache-Control = "no-store"
    Netlify-CDN-Cache-Control = "no-store"

# Every published page is prerendered as a static file, so anything else is a
# real 404 (no more SPA fallback answering 200 for unknown or old URLs).
# Keep this catch-all last. The /ed alias above must stay in front of it.
# netlify/plugins/clinician-portal splices the /clinicianportal proxy in front
# of the first /* rule during the Netlify build. The analyzer door is fetched
# by its edge function and must not gain a status-200 rewrite here: that
# rewrite skips the private edge gate.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
