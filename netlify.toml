[build]
  # Publish the already-built static export. Running `npm run build` on Netlify
  # uses the Vercel/Nitro adapter and writes an empty index.html, which blanks
  # the live site.
  command = "true"
  publish = ".vercel/output/static"

[build.environment]
  NODE_VERSION = "22"

# Gemini / food / labs functions for the simulator (added for /simulator).
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/simulator/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"

[[headers]]
  for = "/simulator/fig3d/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"


# Trailing slash so the simulator's relative asset paths resolve. Must precede the catch-all.
[[redirects]]
  from = "/simulator"
  to = "/simulator/"
  status = 301

[[redirects]]
  from = "/fat-burn-calculator"
  to = "/fat-burn-calculator/"
  status = 301

# Missing hashed files must 404 — never fall through to index.html as text/html
# or the browser refuses to run the page and the header stops working.
[[redirects]]
  from = "/assets/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
