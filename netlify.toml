[build]
  # Publish the already-built static export. Running `npm run build` on Netlify
  # uses the Vercel/Nitro adapter and writes an empty index.html, which blanks
  # the live site.
  command = "true"
  publish = ".vercel/output/static"

[build.environment]
  NODE_VERSION = "22"

# Host-level door for the private clinician workspace. The plugin inserts a
# status-200 proxy for /clinicianportal, /clinicianportal/, and
# /clinicianportal/* immediately before the /* catch-all, and only when the
# Netlify build variable CLINICIAN_PORTAL_ORIGIN is set to the private https
# origin (no path, no credentials). That host stays in the Netlify UI, not in
# this public repo. Until the variable is set, those paths hit the catch-all
# and 404. This does not password-protect the rest of the site.
[[plugins]]
  package = "/netlify/plugins/clinician-portal"

# Removed from theosismedical.com (Health Hacks, simulator and old tools).
# These return a real 404. Never redirect them to theosishealth.com:
# the two sites are kept separate.
[[redirects]]
  from = "/hacks"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/hacks/"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/hacks/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/simulator"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/simulator/"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/simulator/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/personal-fat-threshold"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/personal-fat-threshold/"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/personal-fat-threshold.html"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/personal-fat-threshold/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/fat-burn-calculator"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/fat-burn-calculator/"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/fat-burn-calculator/*"
  to = "/404.html"
  status = 404
  force = true

# Missing hashed files must 404 — never fall through to index.html as text/html
# or the browser refuses to run the page and the header stops working.
[[redirects]]
  from = "/assets/*"
  to = "/404.html"
  status = 404

# Theosis Analyzer door. The private app is served at the root of
# https://theosis-emergency-diagnostics.netlify.app and links assets, API
# calls, and redirects with relative URLs (a request for / answers with
# Location: login.html). Those headers are not rewritten.
#
# Netlify treats /theosisanalyzER and /theosisanalyzER/ as the same redirect
# rule, so a 301 in this file cannot add the slash: that rule loops. The
# /clinicianportal rules avoid that trap by proxying both forms at the
# trailing-slash origin path. This door needs the browser to stay on the
# slashed URL, so netlify/edge-functions/theosis-analyzer-door.js does the 301
# before these rules run. It also sends /ed and other casings to that
# canonical path. Relative login.html and api/* then stay under the prefix.
#
# /theosisanalyzER/* is then a status-200 proxy with the prefix stripped, so
# /theosisanalyzER/api/* goes to /api/* on the private host and nowhere else.
# There is no site-wide /api/* rule. Cookies and Location pass through the
# Netlify proxy unchanged. Same-team Netlify proxies must use the *.netlify.app
# hostname. This does not password-protect the rest of the site.
[[redirects]]
  from = "/ed"
  to = "/theosisanalyzER/"
  status = 301
  force = true

[[redirects]]
  from = "/ed/"
  to = "/theosisanalyzER/"
  status = 301
  force = true

[[redirects]]
  from = "/ed/*"
  to = "/theosisanalyzER/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/theosisanalyzER/"
  to = "https://theosis-emergency-diagnostics.netlify.app/"
  status = 200
  force = true

[[redirects]]
  from = "/theosisanalyzER/*"
  to = "https://theosis-emergency-diagnostics.netlify.app/:splat"
  status = 200
  force = true

# Every published page is prerendered as a static file, so anything else is a
# real 404 (no more SPA fallback answering 200 for unknown or old URLs).
# Keep this catch-all last. The analyzer rules above must stay in front of it.
# netlify/plugins/clinician-portal splices the /clinicianportal proxy in front
# of the first /* rule during the Netlify build.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
